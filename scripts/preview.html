<!doctype html>
<!-- Opens the sidebar panel outside Home Assistant, with sample values.
     Serve the repository (python3 -m http.server) and open /scripts/preview.html?lang=fr (add &night=1 for the moon, &dark for the dark theme, &boost=active for a running solar boost, &code=601 for an OpenWeatherMap weather code: 211 storm, 501 rain, 601 snow, 741 fog,
     &season=summer|winter to move the clock to mid-July or mid-January, same time of day) -->
<meta charset="utf-8">
<body style="margin:0">
<script src="../custom_components/okofen_portal/frontend/okofen-dashboard.js"></script>
<script type="module">
  const params = new URLSearchParams(location.search);
  const season = params.get('season');  // summer: heating off, the pool takes the surplus; winter: heating on, pool off
  if (season) {  // the whole page lives on the 15th of July or January, at the real time of day
    const RealDate = Date, now = new RealDate(), there = new RealDate(now);
    there.setMonth(season === 'summer' ? 6 : 0, 15);
    if (there > now) there.setFullYear(there.getFullYear() - 1);
    const shift = there - now;
    globalThis.Date = class extends RealDate {
      constructor(...a) { super(...(a.length ? a : [RealDate.now() + shift])); }
      static now() { return RealDate.now() + shift; }
    };
  }
  const summer = season === 'summer';
  const sample = {coll: 68.4, tank_top: 65.2, tank_mid: 63.6, tank_bottom: 59.9, ecs_probe: 67, solar_pump: 73, boiler_pump: 0,
    heating_pump: 1, flow: 44.7, room: 22.1, outdoor: 11.8, pool: 15.6, pool_pump: 0, burner: 0, boiler_temp: 55.6, mixer: 2,
    tank_set: 58, room_set: 20, flow_set: 45, ecs_set: 50, ecs_pump: 0,
    ...(summer && {coll: 88.6, tank_top: 71.2, tank_mid: 69.8, tank_bottom: 66.1, ecs_probe: 70.4, solar_pump: 100, heating_pump: 0, flow: 24.1,
      room: 23.4, outdoor: 27.5, pool: 25.8, pool_pump: 1, boiler_temp: 31.2, mixer: 0, tank_set: 8, room_set: 8, flow_set: 8}),
    ...(season === 'winter' && {coll: 31.5, tank_top: 52.4, tank_mid: 46.8, tank_bottom: 33.9, ecs_probe: 54.1, solar_pump: 0, flow: 51.3,
      room: 20.6, outdoor: 2.4, pool: 6.8, boiler_temp: 62.5})};
  const weather = {icon: params.get('night') ? '01n' : '01d', code: +(params.get('code') || 800), clouds: +(params.get('clouds') || 5), wind: '9 km/h',
    sunrise: summer ? '06:12' : season === 'winter' ? '08:58' : '07:45', sunset: summer ? '22:01' : season === 'winter' ? '17:41' : '17:53',
    forecast_temp: summer ? 29 : season === 'winter' ? 4 : 16, forecast_clouds: 10};
  const lang = params.get('lang') || 'en';
  const i18n = await (await fetch(`../custom_components/okofen_portal/i18n/${lang}.json`)).json(), strings = i18n.panel;
  // week programs, Sunday first: [start minute, end minute, level -1 / 0 / +1]
  const every = (slots) => Array(7).fill(slots), weekend = (week, slots) => week.map((s, d) => (d === 0 || d === 6 ? slots : s));
  const schedules = {circuits: [
    {group: 'hk0', title: `${i18n.groups.hk.label} 1`, active: 1, programs: [
      weekend(every([[0, 420, -1], [420, 1080, 0], [1080, 1440, 1]]), [[0, 540, -1], [540, 1080, 0], [1080, 1440, 1]]),
      every([[0, 330, -1], [330, 1260, 0], [1260, 1440, -1]])]},
    {group: 'ww0', title: `${i18n.groups.ww.label} 1`, active: 0, programs: [
      weekend(every([[1110, 1260, 0]]).map((s, d) => (d === 2 ? [[480, 540, 0], ...s] : s)), [[1080, 1260, 0]]), every([])]}]};
  // &dark: the variables Home Assistant's default dark theme gives the panel
  if (params.has('dark')) document.documentElement.style.cssText = '--primary-background-color:#111111;--card-background-color:#1c1c1c;'
    + '--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(225,225,225,0.12);background:#111111';
  const panel = document.createElement('okofen-dashboard');
  panel._tab = params.get('tab') || 'scheme';  // &tab=solar, &tab=history or &tab=programs
  document.body.append(panel);
  // solar boost: waiting for the buffer (add &boost=active for a running one, &presence=home|near|far)
  const active = params.get('boost') === 'active';
  const boost = {enabled: true, state: active ? 'active' : 'waiting', reason: active ? 'running' : 'tank_cold', target: 24, switch: 'switch.okofen_solar_boost',
    heads: ['climate.salon_salon', 'climate.radiateur_2'],
    session: active ? {comfort: 20, target: 22.5, since: Date.now() / 1000 - 3600, heads: {'climate.salon_salon': 20, 'climate.radiateur_2': 20}} : null,
    checks: [
      {id: 'burner', ok: true, value: 0}, ...(active ? [{id: 'manual', ok: true, value: 22.5, limit: 22.5}] : []),
      {id: 'occupied', ok: params.get('presence') !== 'home', value: params.get('presence') || 'near'},
      {id: 'far_away', ok: params.get('presence') !== 'far', value: params.get('presence') === 'far' ? 65.2 : null, limit: 80},
      {id: 'heating_off', ok: true}, {id: 'outside_window', ok: true, value: 13 * 60 + 5, limit: [585, 1003]},
      {id: 'cloudy', ok: true, value: 10, limit: 55}, {id: 'mild_outdoor', ok: true, value: 11.8, limit: 20},
      {id: 'tank_cold', ok: active, value: 65.2, limit: active ? 60.9 : 66.5}, {id: 'hot_water_low', ok: true, value: 67, limit: active ? 53 : 55},
      {id: 'room_warm', ok: true, value: 21.1, limit: active ? 23 : 23}]};
  // history: scripts/preview-history.json if present (python3 scripts/preview_history.py), otherwise made up;
  // &fake=10 always makes up that many days (yesterday and today included), each with its own weather
  const fakeHistory = (days = 2) => {
    const series = ['tank_top', 'tank_mid', 'tank_bottom', 'ecs_probe', 'coll', 'flow', 'room', 'outdoor', 'burner', 'boiler_pump', 'solar_pump',
      'heating_pump', 'pool_pump', 'boost', 'clouds', 'code', 'icon'];
    // sunshine of each day, oldest first, and its sky (OpenWeatherMap codes): sunny, cloudy, rain, snow
    const SUN = [0.9, 0.3, 1, 0.1, 0.7, 0, 0.5, 1, 0.2, 0.8];
    const sky = (sf, d) => (d % 10 === 5 ? [100, 601] : sf > 0.7 ? [10, 800] : sf > 0.4 ? [45, 802] : sf > 0.15 ? [85, 804] : [95, 501]);
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - days + 1);
    const points = [];
    let top = 52, burning = false;
    for (let ts = start / 1000, n = 0; ts < Date.now() / 1000; ts += 60, n++) {
      const d = new Date(ts * 1000), day = Math.floor(n / 1440), h = d.getHours() + d.getMinutes() / 60;
      const sf = SUN[(day + 10 - days % 10) % 10], [clouds, code] = sky(sf, day + 10 - days % 10);
      const [rise, length] = summer ? [6.2, 15.8] : season === 'winter' ? [9, 8.7] : [8, 9.5];  // daylight, in hours
      const sun = Math.max(0, Math.sin((h - rise) / length * Math.PI)) * sf;
      const heating = !summer && h > 5.5 && h < 22.5 && h % 2 < 1.4, coll = 8 + 70 * sun, bottom = top - 16 + 10 * sun, solar = coll > bottom + 6;
      // the buffer tank: warmed by the sun, cooled by the heating, the burner keeps it above 45 °C
      top += (solar ? 0.035 * sf : 0) - (heating ? 0.012 : 0.003) + (burning ? 0.15 : 0);
      top = Math.min(top, 72);  // the solar circuit stops at the tank's maximum
      if (top < 45) burning = true; else if (top > 55) burning = false;
      const pool = season !== 'winter' && sf > 0.6 && h > 10 && h < (summer ? 19 : 16), boost = !summer && sf > 0.85 && h > 11 && h < 15;
      const row = [top, top - 4, bottom, top - 1, coll, heating ? 38 + 4 * Math.sin(h) : 22, 20.3 + sun * 1.6 + (boost ? 1.5 : 0), (summer ? 15 : season === 'winter' ? -3 : 2) + day % 4 + (summer ? 13 : 8) * sun,
        +burning, +burning, solar ? 60 : 0, heating ? 45 : 0, +pool, +boost, clouds, code, null];
      // a Home Assistant restart four days ago at 02:00: 40 minutes not recorded
      points.push([ts, ...(day === days - 5 && h >= 2 && h < 2.67 ? row.map((v, i) => (i >= 13 ? v : null)) : row)]);
    }
    return {series, points};
  };
  const fake = params.has('fake');
  const history = fake ? fakeHistory(+params.get('fake') || 10)
    : await fetch('preview-history.json').then((r) => (r.ok ? r.json() : fakeHistory())).catch(() => fakeHistory());
  // on/off values Home Assistant did not record (entity disabled): made-up runs, so every mark of the replay strip shows
  const runs = {burner: (h) => h > 6.2 && h < 6.9, boiler_pump: (h) => h > 6.2 && h < 7.1, heating_pump: (h) => h > 5.5 && h < 22.5 && h % 2 < 1.4, pool_pump: (h) => h > 10 && h < 16};
  for (const [k, on] of Object.entries(runs)) {
    const i = history.series.indexOf(k) + 1;
    if (i && history.points.every((p) => p[i] == null)) history.points.forEach((p) => { const d = new Date(p[0] * 1000); p[i] = on(d.getHours() + d.getMinutes() / 60) ? 1 : 0; });
  }
  if (params.has('gap')) {  // &gap=17:20: nothing recorded before yesterday at that time, as right after enabling the entities
    const [hh, mm] = params.get('gap').split(':'), until = new Date(); until.setHours(+hh, +mm, 0, 0);
    const keep = new Set(['boost', 'clouds', 'code', 'icon'].map((k) => history.series.indexOf(k) + 1));
    for (const p of history.points) if (p[0] < until / 1000 - 86400) p.forEach((v, i) => { if (i && !keep.has(i)) p[i] = null; });
  }
  if (params.has('seek')) setTimeout(() => panel._seek(+params.get('seek')), 1500);  // &seek=<minute index> to open on a past moment
  panel.hass = {language: lang, themes: {darkMode: params.has('dark')}, states: {'climate.salon_salon': {attributes: {friendly_name: 'Salon'}}},
    callService: async (domain, service) => { boost.enabled = service === 'turn_on'; boost.state = boost.enabled ? 'waiting' : 'inactive'; boost.reason = boost.enabled ? 'tank_cold' : 'disabled'; },
    callWS: async (msg) => (msg.type === 'okofen_portal/history' ? day(msg) : msg.type === 'okofen_portal/schedules' ? schedules
      : {language: lang, strings, values: sample, weather, boost})};
  // the window the panel asks for; with the sample, older days replay its two days again, as far as a recorder keeping 10 days
  // (with &gap nothing is older than the sample, so the panel greys ‹); with &fake, the made-up days as they are
  function day({start, end}) {
    const base = history.points[0][0], k = fake ? 0 : Math.max(0, Math.round((base - start) / 86400));  // whole days, whatever the clock change
    const byMinute = new Map(history.points.map((p) => [Math.round((p[0] - k * 86400) / 60) * 60, p]));
    const blank = history.series.map(() => null), points = [];
    // one point a minute over the whole window, empty where nothing was recorded, as the integration sends it
    for (let ts = Math.ceil(start / 60) * 60; ts < end; ts += 60) points.push([ts, ...(byMinute.get(ts)?.slice(1) ?? blank)]);
    return {...history, first: fake ? base : params.has('gap') ? base + 60 : base - 8 * 86400, points};
  }
</script>
