<!doctype html>
<!-- Opens the sidebar panel outside Home Assistant, with sample values: open this file in a browser. -->
<meta charset="utf-8">
<body style="margin:0">
<script src="../custom_components/okofen_portal/frontend/okofen-dashboard.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const sample = {coll: 68.4, tank_top: 65.2, tank_mid: 63.6, tank_bottom: 59.9, ecs_probe: 67, solar_pump: 73, boiler_pump: 0,
    heating_pump: 1, flow: 44.7, room: 22.1, outdoor: 11.8, pool: 15.6, pool_pump: 0, burner: 0, boiler_temp: 55.6, mixer: 2};
  const panel = document.createElement('okofen-dashboard');
  document.body.append(panel);
  panel.hass = {language: params.get('lang') || 'fr', themes: {darkMode: params.has('dark')},
    callWS: async () => ({language: 'fr', values: sample})};
  if (params.get('scenario')) setTimeout(() => { const s = panel.shadowRoot.getElementById('sc'); s.value = params.get('scenario'); s.onchange({target: s}); }, 100);
</script>
